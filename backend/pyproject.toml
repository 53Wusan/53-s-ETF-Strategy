[project]
name = "leveraged-etf-strategy"
version = "0.1.0"
description = "Explainable fear/greed signals and portfolio tracking for leveraged ETFs"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "apscheduler>=3.10,<4",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pandas-market-calendars>=4.6,<6",
  "pillow>=11,<12",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "pyjwt>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "scipy>=1.14,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]
research = [
  "jupyter>=1.1,<2",
  "matplotlib>=3.10,<4",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "scikit-learn>=1.7,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "B008",  # FastAPI dependency injection intentionally uses Depends in defaults.
  "E501",  # Formatting and payload literals are clearer without forced wrapping.
  "UP017", # timezone.utc remains compatible and explicit across supported Python versions.
  "UP042", # str + Enum is required for predictable SQLAlchemy/Pydantic serialization.
]
