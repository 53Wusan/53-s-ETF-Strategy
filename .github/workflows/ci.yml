name: offline-validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src/money_back
      - name: Unit and frozen regression tests
        run: python -m pytest
      - name: Offline notebook smoke
        run: python scripts/execute_notebook.py notebooks/02_t5_strict_validation.ipynb
